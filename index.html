<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostik SKD CPNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: satu kolom kerja. Warna per subtes: TWK teal, TIU ungu, TKP jingga. Huruf dasar 18px, bisa 3 ukuran. */
:root{
  --fs:18px;
  --bg:#f3f6f8; --card:#ffffff; --ink:#14202b; --muted:#566676; --line:#d9e1e7;
  --accent:#0b6e74; --accent-ink:#ffffff; --accent-soft:#dff1f2;
  --good:#17753f; --good-soft:#dcf3e5; --warn:#8f5200; --warn-soft:#fdf0d4; --bad:#b3261e; --bad-soft:#fde4e1;
  --c-twk:#0b6e74; --c-twk-soft:#dcf1f2; --c-tiu:#5844c4; --c-tiu-soft:#e9e5fc; --c-tkp:#b8500a; --c-tkp-soft:#fdebd8;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151b; --card:#17212a; --ink:#e9eff4; --muted:#a3b3c0; --line:#2b3a47;
  --accent:#4fc3c9; --accent-ink:#06282b; --accent-soft:#12343a;
  --good:#5fd596; --good-soft:#133524; --warn:#f2b552; --warn-soft:#3a2c0e; --bad:#ff8f86; --bad-soft:#3d1a18;
  --c-twk:#4fc3c9; --c-twk-soft:#12343a; --c-tiu:#aa9dff; --c-tiu-soft:#272250; --c-tkp:#ffa862; --c-tkp-soft:#3d2a16; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e151b; --card:#17212a; --ink:#e9eff4; --muted:#a3b3c0; --line:#2b3a47;
  --accent:#4fc3c9; --accent-ink:#06282b; --accent-soft:#12343a;
  --good:#5fd596; --good-soft:#133524; --warn:#f2b552; --warn-soft:#3a2c0e; --bad:#ff8f86; --bad-soft:#3d1a18;
  --c-twk:#4fc3c9; --c-twk-soft:#12343a; --c-tiu:#aa9dff; --c-tiu-soft:#272250; --c-tkp:#ffa862; --c-tkp-soft:#3d2a16; color-scheme:dark;}
.s-TWK{--sc:var(--c-twk);--ss:var(--c-twk-soft)} .s-TIU{--sc:var(--c-tiu);--ss:var(--c-tiu-soft)} .s-TKP{--sc:var(--c-tkp);--ss:var(--c-tkp-soft)}

*{box-sizing:border-box}
html{font-size:var(--fs)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.65;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.3rem;font-weight:800} h3{font-size:1.08rem;font-weight:700} h4{font-size:1rem;font-weight:800}
p{margin:0}
.wrap{max-width:800px;margin:0 auto;padding:18px 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.muted{color:var(--muted)} .small{font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.grid3{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer}
.btn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 18px;min-height:46px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.opt:focus-within,.nav button:focus-visible,input:focus-visible,summary:focus-visible,.fsb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.tag{display:inline-block;font-size:.82rem;font-weight:800;letter-spacing:.04em;padding:3px 11px;border-radius:99px;background:var(--ss,var(--accent-soft));color:var(--sc,var(--accent))}
.pill{display:inline-block;font-size:.84rem;font-weight:800;padding:3px 12px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.near{background:var(--warn-soft);color:var(--warn)} .pill.low{background:var(--bad-soft);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.95rem;vertical-align:middle}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.scroll-x{overflow-x:auto}
.hide{display:none!important}

/* kontrol ukuran huruf */
.fsw{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.fsb{border:0;background:transparent;color:var(--ink);font-weight:800;padding:6px 12px;min-height:42px}
.fsb.on{background:var(--accent);color:var(--accent-ink)}
.fsb:nth-child(1){font-size:.9rem}.fsb:nth-child(2){font-size:1.1rem}.fsb:nth-child(3){font-size:1.3rem}

/* tes */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.timer{font-family:var(--mono);font-weight:600;font-size:1.7rem;font-variant-numeric:tabular-nums;padding:2px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line)}
.timer.warn{color:var(--warn);border-color:var(--warn)} .timer.crit{color:var(--bad);border-color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.qcard{border-left:8px solid var(--sc)}
.qtext{font-size:1.2rem;line-height:1.7;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:12px;margin:18px 0 0;padding:0;border:0;min-width:0}
.opt{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;background:var(--card);font-size:1.12rem;line-height:1.55}
.opt:hover{border-color:var(--sc)}
.opt.sel{border-color:var(--sc);background:var(--ss)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.bub{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line);color:var(--ink)}
.opt.sel .bub{background:var(--sc);color:var(--card)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.nav button{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:1rem;font-variant-numeric:tabular-nums;position:relative}
.nav button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nav button.cur{outline:3px solid var(--ink);outline-offset:1px}
.nav button.flag::after{content:"";position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:2px solid var(--line)}

/* hasil */
.big{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.scorebox{border:1px solid var(--line);border-top:6px solid var(--sc);border-radius:16px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.meter{position:relative;height:12px;border-radius:9px;background:var(--line)}
.meter>i{position:absolute;left:0;top:0;height:100%;border-radius:9px;background:var(--sc)}
.meter>u{position:absolute;top:-5px;width:3px;height:22px;background:var(--ink);border-radius:2px;text-decoration:none}
.sec-h{display:flex;align-items:center;gap:12px}
.letter{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.2rem;background:var(--accent);color:var(--accent-ink);flex:0 0 auto}
.bedah{border:1px solid var(--line);border-left:8px solid var(--sc);border-radius:14px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:10px}
ul.dots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.dots li{position:relative;padding-left:22px}
ul.dots li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--sc,var(--accent))}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
ol.steps li{position:relative;padding-left:40px;counter-increment:st}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.blk{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.blk>svg{flex:0 0 auto;width:26px;height:26px;margin-top:1px}
.blk>div{min-width:0;flex:1}
.blk h4{margin-bottom:6px}
.blk.core{background:var(--ss);color:var(--ink)} .blk.core svg{stroke:var(--sc)}
.blk.kon{border:2px solid var(--line);background:var(--card)} .blk.kon svg{stroke:var(--sc)}
.blk.fast{background:var(--accent-soft)} .blk.fast svg{stroke:var(--accent)}
.blk.trap{background:var(--warn-soft)} .blk.trap svg{stroke:var(--warn)}
.blk.mn{border:2px dashed var(--sc);background:var(--card)} .blk.mn svg{stroke:var(--sc)}
svg.ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* accordion pembahasan */
details.rv{border:1px solid var(--line);border-left:8px solid var(--sc);border-radius:16px;background:var(--card);overflow:hidden}
details.rv>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.rv>summary::-webkit-details-marker{display:none}
.num{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--ss);color:var(--sc);font-size:1.05rem}
.sumtxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.sumtxt b{font-size:1rem} .sumtxt span{font-size:.88rem;color:var(--muted)}
.chev{flex:0 0 auto;width:12px;height:12px;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin:0 6px 4px 0}
details[open]>summary .chev{transform:rotate(225deg);margin-bottom:-4px}
.rvbody{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.rvbody .qtext{font-size:1.08rem}
.orow{display:flex;gap:12px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.orow .lt{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line)}
.orow .ot{font-weight:600;line-height:1.5}
.orow .rs{font-size:.96rem;color:var(--muted);margin-top:4px;line-height:1.55}
.orow .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.orow.key{border-color:var(--good);background:var(--good-soft)} .orow.key .lt{background:var(--good);color:var(--card)} .orow.key .rs{color:var(--ink)}
.orow.s4{border-color:var(--accent);background:var(--accent-soft)} .orow.s4 .lt{background:var(--accent);color:var(--accent-ink)}
.orow.low{background:var(--card)}
.orow.you{box-shadow:0 0 0 3px var(--bad)}
.orow.you.key{box-shadow:0 0 0 3px var(--good)}
.bdg{font-size:.8rem;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.bdg.g{background:var(--good);color:var(--card)} .bdg.b{background:var(--bad);color:var(--card)} .bdg.a{background:var(--accent);color:var(--accent-ink)}
.vd{flex:0 0 auto;font-size:.82rem;font-weight:800;padding:4px 11px;border-radius:99px}
.vd.ok{background:var(--good-soft);color:var(--good)} .vd.bad{background:var(--bad-soft);color:var(--bad)} .vd.part{background:var(--warn-soft);color:var(--warn)}
textarea{width:100%;min-height:160px;font-family:var(--mono);font-size:.88rem;line-height:1.55;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink)}
input[type=text],input[type=number]{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;background:var(--bg);color:var(--ink);width:100%}
label{font-size:.88rem;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.modal{position:fixed;inset:0;background:rgba(5,12,18,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:440px;width:100%}
.hero{border-radius:20px;padding:22px;background:linear-gradient(135deg,var(--accent-soft),var(--card));border:1px solid var(--line)}
.step3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.step3{grid-template-columns:1fr}}
.pg td:first-child{font-weight:800}
@media (prefers-reduced-motion:no-preference){.bar>i,.meter>i{transition:width .4s ease}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

/* pilihan latihan */
.grid3.one{grid-template-columns:1fr}
fieldset.cfg{border:0;margin:0;padding:0;min-width:0}
fieldset.cfg legend{font-weight:800;font-size:.9rem;color:var(--muted);padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:10px 18px;min-height:48px;font-weight:700;background:var(--card);cursor:pointer}
.chip small{font-weight:600;color:var(--muted);font-size:.8rem}
.chip input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip input:checked+span small{color:inherit}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.chip input:disabled+span{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ===== KONSTANTA ===== */
var FILES = {TWK:"twk.json", TIU:"tiu.json", TKP:"tkp.json"};
var SUBS = ["TWK","TIU","TKP"];
var DIAG_SEC = 22*60;          /* diagnostik: 25 soal, 22 menit */
var PACE = 54;                 /* detik per soal pada tes asli: 100 menit untuk 110 soal, dibulatkan */
var PG = {TWK:65, TIU:80, TKP:166};
var MAXFULL = {TWK:150, TIU:175, TKP:225};
var LETTERS = ["A","B","C","D","E"];
var TKP_TARGET = 195;
var LS_HIST="skd_tracker_v1", LS_SESS="skd_session_v2", LS_FS="skd_fontsize_v1", LS_STATS="skd_stats_v1";
var SUBNAME = {TWK:"Tes Wawasan Kebangsaan", TIU:"Tes Intelegensia Umum", TKP:"Tes Karakteristik Pribadi"};

var FAMT={
 F:{n:"Fakta mirip",d:"Opsi pengecoh hampir sama dengan jawaban benar dan hanya beda satu detail (pasal, tokoh, lembaga, urutan). Kecenderungan: menjawab dari rasa 'pernah dengar', bukan mencocokkan detail persis.",t:"Coret opsi yang salah di satu detail. Jika dua opsi mirip, bandingkan hanya bagian yang berbeda. Hafalkan pasangan fakta, bukan fakta tunggal."},
 R:{n:"Salah baca fokus soal",d:"Terpancing hasil atau kesan umum, padahal soal menanyakan hal lain (misalnya proses, bukan hasil).",t:"Sebelum membaca opsi, tulis dulu kata tanyanya: apa yang sebenarnya ditanyakan? Garis bawahi kata kunci."},
 I:{n:"Jalur resmi vs tindakan senyap",d:"Memilih tindakan senyap atau setengah jalan (menerima, mengembalikan diam-diam, menunggu) alih-alih jalur resmi yang transparan.",t:"Untuk soal integritas, pilih opsi yang melibatkan jalur resmi dan transparan. Coret opsi bertanda 'diam-diam', 'menunggu', atau 'membagikan'."},
 B:{n:"Aturan kalimat efektif",d:"Kurang teliti pada pemborosan kata dan penjamakan ganda.",t:"Cek penanda jamak dan kata mubazir lebih dulu: para + kata ulang, banyak + para, beberapa + semua."},
 H:{n:"Rumus dan hitungan",d:"Salah memilih rumus atau terjebak hasil intuitif (menjumlahkan persen, memakai rata-rata biasa untuk kecepatan).",t:"Kerjakan lewat bilangan bulat (KPK, total, faktor pengali). Beri batas sekitar 60 detik; bila lewat, tandai ragu dan lanjut."},
 L:{n:"Penalaran melampaui premis",d:"Kesimpulan menyimpang dari premis atau teks. Opsi tampak masuk akal tetapi tidak ditunjang data, atau tergoda opsi bermakna mutlak.",t:"Uji tiap opsi hanya terhadap premis atau teks, bukan terhadap pengetahuan sendiri. Gambar diagram atau kotak. Curigai kata mutlak."},
 K:{n:"Respons aman tetapi pasif",d:"Memilih respons aman atau pasif (menunggu, hanya melapor, menghindar) padahal skor 5 menuntut respons yang proaktif, sesuai aturan, dan solutif.",t:"Urutkan opsi dari pasif ke proaktif. Skor 5 umumnya menggabungkan komunikasi langsung, kepatuhan aturan, solusi, dan tindak lanjut ke pihak yang tepat. Panjang opsi bukan patokan."}
};

/* ===== IKON ===== */
var ICO={
 target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
 zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
 alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
 star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
};
function ico(n){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+ICO[n]+'</svg>'; }

/* ===== STORAGE (satu browser; boleh gagal) ===== */
function lsGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ===== UTIL ===== */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function fmt(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
function $(id){ return document.getElementById(id); }
function statusOf(v,pg){ return v>=pg?"ok":(v>=pg*0.9?"near":"low"); }
function statusLabel(c){ return c==="ok"?"Di atas PG":(c==="near"?"Dekat PG":"Di bawah PG"); }
function mainOf(q){ return q.topic.split(":")[0].trim(); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function copyText(text,msg){
  var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;left:-9999px;top:0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  var fail="Gagal menyalin. Salin teksnya secara manual.", done=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){msg.textContent="Tersalin.";},function(){msg.textContent=fail;}); done=true; } }catch(e){}
  if(!done){ try{ done=document.execCommand("copy"); }catch(e){} msg.textContent=done?"Tersalin.":fail; }
  ta.remove();
}

/* ===== UKURAN HURUF ===== */
var FS={n:"18px",b:"21px",x:"24px"};
function getFs(){ var v=lsGet(LS_FS); return (v&&FS[v])?v:"n"; }
function applyFs(){ var v=getFs(); document.documentElement.style.setProperty("--fs",FS[v]);
  Array.prototype.forEach.call(document.querySelectorAll("[data-fs]"),function(b){ b.classList.toggle("on",b.getAttribute("data-fs")===v); b.setAttribute("aria-pressed",b.getAttribute("data-fs")===v?"true":"false"); }); }
function fsCtl(){ return '<div class="fsw" role="group" aria-label="Ukuran huruf"><button type="button" class="fsb" data-fs="n" aria-label="Huruf normal">A</button><button type="button" class="fsb" data-fs="b" aria-label="Huruf besar">A</button><button type="button" class="fsb" data-fs="x" aria-label="Huruf sangat besar">A</button></div>'; }
document.addEventListener("click",function(e){ var b=e.target.closest&&e.target.closest("[data-fs]"); if(!b) return; lsSet(LS_FS,b.getAttribute("data-fs")); applyFs(); });

/* ===== BANK SOAL (dimuat dari twk.json, tiu.json, tkp.json) ===== */
var BANK=[], BYID={}, BADQ=[], Q=[];
function validQ(q,file){
  var why=null;
  if(!q||typeof q!=="object") why="bukan objek";
  else if(!q.id||typeof q.id!=="string") why="id kosong";
  else if(q.sub!==file) why="sub harus "+file;
  else if(!q.topic||!q.q) why="topic atau q kosong";
  else if(!Array.isArray(q.o)||q.o.length!==5) why="opsi (o) harus 5";
  else if(q.sub==="TKP"){ if(!Array.isArray(q.s)||q.s.length!==5||q.s.slice().sort().join("")!=="12345") why="skor (s) harus permutasi 1-5"; }
  else if(LETTERS.indexOf(q.k)<0) why="kunci (k) harus A-E";
  return why;
}
function loadBank(){
  return Promise.all(SUBS.map(function(s){
    return fetch(FILES[s],{cache:"no-cache"}).then(function(r){ if(!r.ok) throw new Error(FILES[s]+" (HTTP "+r.status+")"); return r.json(); })
      .then(function(arr){ if(!Array.isArray(arr)) throw new Error(FILES[s]+" harus berisi daftar soal"); return {s:s,arr:arr}; });
  })).then(function(res){
    BANK=[]; BYID={}; BADQ=[];
    res.forEach(function(x){ x.arr.forEach(function(q,i){
      var why=validQ(q,x.s);
      if(!why&&BYID[q.id]) why="id ganda";
      if(why){ BADQ.push(FILES[x.s]+" #"+(i+1)+(q&&q.id?" ("+q.id+")":"")+": "+why); return; }
      BANK.push(q); BYID[q.id]=q;
    }); });
  });
}
function setQ(ids){ Q=ids.map(function(id){return BYID[id];}); return Q.every(function(q){return !!q;}); }
function cnt(s){ return Q.filter(function(q){return q.sub===s;}).length; }
function qIdx(s){ var r=[]; Q.forEach(function(q,i){ if(q.sub===s) r.push(i); }); return r; }
function subsIn(){ return SUBS.filter(function(s){return cnt(s)>0;}); }
function diagIds(){ return BANK.filter(function(q){return q.diag;}).sort(function(a,b){return a.diag-b.diag;}).map(function(q){return q.id;}); }

/* ===== STATISTIK LATIHAN (per soal, per browser) ===== */
function getStats(){ return lsGet(LS_STATS)||{}; }
function mainAcc(stats,sub,main){
  var n=0,c=0; BANK.forEach(function(q){ if(q.sub===sub&&mainOf(q)===main&&stats[q.id]){ n+=stats[q.id].n; c+=stats[q.id].c; } });
  return n?c/n:null;
}
function weakOrder(pool){
  var st=getStats();
  return shuffle(pool).map(function(q){
    var s=st[q.id], p;
    if(!s||!s.n) p=2;
    else { var ma=mainAcc(st,q.sub,mainOf(q)); p=(1-s.c/s.n)+(ma===null?0:(1-ma)); }
    return {q:q,p:p};
  }).sort(function(a,b){return b.p-a.p;}).map(function(x){return x.q;});
}

/* ===== SKOR ===== */
function scoreAll(ans){
  var raw={TWK:0,TIU:0,TKP:0}, correct={TWK:0,TIU:0,TKP:0}, per=[];
  Q.forEach(function(q,i){
    var a=ans[i], pts=0, ok=false;
    if(a!==undefined&&a!==null){
      if(q.sub==="TKP"){ pts=q.s[a]; ok=(pts===5); }
      else { ok=(LETTERS[a]===q.k); pts=ok?5:0; }
      if(ok) correct[q.sub]++;
    }
    raw[q.sub]+=pts; per.push({pts:pts,ok:ok,answered:(a!==undefined&&a!==null)});
  });
  var scaled={}, all=true;
  SUBS.forEach(function(s){ var n=cnt(s); if(n){ scaled[s]=Math.round(raw[s]/(n*5)*MAXFULL[s]); } else { scaled[s]=null; all=false; } });
  scaled.total=all?(scaled.TWK+scaled.TIU+scaled.TKP):null;
  return {raw:raw,correct:correct,per:per,scaled:scaled};
}

/* ===== STATE ===== */
var S=null, timerId=null, lastTick=0;
function newSession(mode,sub,ids){
  if(!setQ(ids)) return;
  var now=Date.now(), total=(mode==="diag")?DIAG_SEC:Math.max(60,Math.round(ids.length*PACE));
  S={mode:mode,sub:sub||null,ids:ids,idx:0,ans:{},flags:{},times:{},start:now,deadline:now+total*1000,total:total,done:false,at:now};
  lsSet(LS_SESS,S); lastTick=now; startTimer(); renderTest(); window.scrollTo(0,0);
}
function save(){ lsSet(LS_SESS,S); }
function sessLabel(s){ return s.mode==="diag"?"Diagnostik 25 soal":("Latihan "+s.sub+" ("+s.ids.length+" soal)"); }
function startPractice(sub,count,order){
  var pool=BANK.filter(function(q){return q.sub===sub;});
  if(!pool.length) return;
  var n=(count==="all")?pool.length:Math.min(parseInt(count,10),pool.length);
  var arr=(order==="fokus")?weakOrder(pool):shuffle(pool);
  newSession("latihan",sub,arr.slice(0,n).map(function(q){return q.id;}));
}

/* ===== LAYAR: TES ===== */
function startTimer(){ if(timerId) clearInterval(timerId); timerId=setInterval(tick,250); }
function tick(){
  if(!S||S.done) return;
  var now=Date.now(), dt=Math.min(now-lastTick,1000)/1000; lastTick=now;
  S.times[S.idx]=(S.times[S.idx]||0)+dt;
  var rem=Math.ceil((S.deadline-now)/1000);
  var t=$("timer");
  if(t){ t.textContent=fmt(rem); t.className="timer"+(rem<=60?" crit":(rem<=Math.max(60,S.total*0.2)?" warn":"")); }
  if(rem<=0){ finish(true); }
}
function renderTest(){
  var q=Q[S.idx], i=S.idx, app=$("app");
  var sel=S.ans[i];
  var opts=q.o.map(function(t,j){
    return '<label class="opt'+(sel===j?' sel':'')+'" for="o'+j+'"><input type="radio" name="opt" id="o'+j+'" value="'+j+'"'+(sel===j?' checked':'')+'><span class="bub">'+LETTERS[j]+'</span><span>'+esc(t)+'</span></label>';
  }).join("");
  var nav=Q.map(function(x,k){
    var cls=(S.ans[k]!==undefined?" done":"")+(k===i?" cur":"")+(S.flags[k]?" flag":"");
    return '<button type="button" class="'+cls.trim()+'" data-k="'+k+'" aria-label="Soal '+(k+1)+(S.ans[k]!==undefined?', terjawab':', belum dijawab')+(S.flags[k]?', ditandai ragu':'')+'">'+(k+1)+'</button>';
  }).join("");
  var answered=Object.keys(S.ans).length;
  app.innerHTML=
  '<div class="topbar"><div class="wrap"><div style="min-width:0"><div class="small muted">Soal '+(i+1)+' dari '+Q.length+' &middot; terjawab '+answered+'</div><div class="bar" style="width:150px;margin-top:6px"><i style="width:'+(answered/Q.length*100)+'%"></i></div></div><div class="row" style="flex-wrap:nowrap">'+fsCtl()+'<div class="timer" id="timer" role="timer" aria-live="off">'+fmt((S.deadline-Date.now())/1000)+'</div></div></div></div>'+
  '<div class="wrap stack">'+
   '<div class="card qcard s-'+q.sub+'"><div class="row between"><span class="tag">'+q.sub+'</span><span class="small muted">'+esc(q.topic)+'</span></div>'+
   '<p class="qtext" style="margin-top:14px">'+esc(q.q)+'</p>'+
   '<fieldset class="opts" aria-label="Pilihan jawaban">'+opts+'</fieldset></div>'+
   '<div class="row between">'+
     '<button class="btn" id="bPrev"'+(i===0?' disabled':'')+'>Sebelumnya</button>'+
     '<button class="btn" id="bFlag">'+(S.flags[i]?'Hapus tanda ragu':'Tandai ragu')+'</button>'+
     '<button class="btn primary" id="bNext"'+(i===Q.length-1?' disabled':'')+'>Berikutnya</button>'+
   '</div>'+
   '<div class="card stack"><div class="nav" id="nav">'+nav+'</div>'+
    '<div class="legend"><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>Terjawab</span><span><i></i>Belum</span><span><i style="background:var(--warn);border-color:var(--warn);border-radius:50%"></i>Ragu</span></div></div>'+
   '<div class="row" style="justify-content:flex-end"><button class="btn danger" id="bFinish">Selesai dan lihat hasil</button></div>'+
  '</div>';
  Array.prototype.forEach.call(document.querySelectorAll("input[name=opt]"),function(el){
    el.onchange=function(){ S.ans[i]=parseInt(el.value,10); save(); renderTest(); };
  });
  $("bPrev").onclick=function(){ go(i-1); };
  $("bNext").onclick=function(){ go(i+1); };
  $("bFlag").onclick=function(){ if(S.flags[i]) delete S.flags[i]; else S.flags[i]=1; save(); renderTest(); };
  $("nav").onclick=function(e){ var b=e.target.closest("button[data-k]"); if(b) go(parseInt(b.getAttribute("data-k"),10)); };
  $("bFinish").onclick=confirmFinish;
  applyFs(); tick();
}
function go(k){ if(k<0||k>=Q.length) return; S.idx=k; save(); renderTest(); window.scrollTo(0,0); }
function confirmFinish(){
  var un=Q.length-Object.keys(S.ans).length, fl=Object.keys(S.flags).length;
  var m=document.createElement("div"); m.className="modal"; m.id="modal";
  m.innerHTML='<div class="card stack" role="dialog" aria-modal="true" aria-label="Konfirmasi selesai"><h2>Akhiri tes sekarang?</h2><p>'+(un>0?'Masih ada <b>'+un+'</b> soal belum dijawab. Soal kosong bernilai 0.':'Semua soal sudah dijawab.')+(fl?' '+fl+' soal ditandai ragu.':'')+'</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mNo">Kembali ke soal</button><button class="btn primary" id="mYes">Ya, selesai</button></div></div>';
  document.body.appendChild(m);
  $("mNo").onclick=function(){ m.remove(); }; $("mYes").onclick=function(){ m.remove(); finish(false); };
  $("mNo").focus();
}

/* ===== SELESAI ===== */
function finish(auto){
  if(!S||S.done) return;
  if(!auto){ tick(); if(S.done) return; }
  S.done=true; S.auto=!!auto; S.endedAt=auto?Math.min(Date.now(),S.deadline):Date.now(); save();
  if(timerId){ clearInterval(timerId); timerId=null; }
  var r=scoreAll(S.ans);
  /* riwayat skor */
  var h=lsGet(LS_HIST)||[];
  h.push({t:S.endedAt,label:sessLabel(S)+" (estimasi)",TWK:r.scaled.TWK,TIU:r.scaled.TIU,TKP:r.scaled.TKP,est:true});
  lsSet(LS_HIST,h);
  /* statistik per soal untuk 'fokus kelemahan' */
  var st=getStats();
  Q.forEach(function(q,i){ var s=st[q.id]||{n:0,c:0}; s.n++; if(r.per[i].ok) s.c++; st[q.id]=s; });
  lsSet(LS_STATS,st);
  renderResult(auto);
}

/* ===== LAYAR: HASIL ===== */
function listHtml(arr,cls){ return '<ul class="dots">'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'; }
function reviewCard(i,r){
  var q=Q[i], p=r.per[i], a=S.ans[i], cls, head;
  if(q.sub==="TKP"){ cls=p.ok?"ok":(p.answered&&p.pts===4?"part":"bad"); head=p.answered?('Skor '+p.pts+(p.ok?' (tepat sasaran)':' (meleset)')):'Kosong (0)'; }
  else { cls=p.ok?"ok":"bad"; head=p.ok?'Benar +5':(p.answered?'Salah':'Kosong'); }
  var best=(q.sub==="TKP")?q.s.indexOf(5):LETTERS.indexOf(q.k);
  var rows=q.o.map(function(t,j){
    var c="orow", bd="";
    if(q.sub==="TKP"){ var sc=q.s[j]; c+=(sc===5?" key":(sc===4?" s4":" low")); bd='<span class="bdg'+(sc===5?' g':(sc===4?' a':''))+'">Skor '+sc+'</span>'; }
    else if(j===best){ c+=" key"; bd='<span class="bdg g">Kunci</span>'; }
    if(p.answered&&a===j){ c+=" you"; bd+=' <span class="bdg b" style="'+(j===best?'background:var(--good)':'')+'">Pilihanmu</span>'; }
    return '<div class="'+c+'"><span class="lt">'+LETTERS[j]+'</span><div><div class="ot">'+esc(t)+'</div><div class="badges">'+bd+'</div>'+(q.opt&&q.opt[j]?'<div class="rs">'+esc(q.opt[j])+'</div>':'')+'</div></div>';
  }).join("");
  var statusNote='<p class="small muted">Status soal: '+esc(q.status||"draf")+' &middot; sumber: '+esc(q.source||"orisinal")+'. '+((q.status||"draf")==="terverifikasi"?'':'Belum diverifikasi ke sumber resmi.')+'</p>';
  return '<details class="rv s-'+q.sub+'" data-ok="'+(p.ok?1:0)+'"><summary><span class="num">'+(i+1)+'</span><span class="sumtxt"><b>'+esc(q.topic)+'</b><span>'+q.sub+' &middot; '+Math.round(S.times[i]||0)+' dtk</span></span><span class="vd '+cls+'">'+head+'</span><span class="chev" aria-hidden="true"></span></summary>'+
   '<div class="rvbody">'+
    '<p class="qtext">'+esc(q.q)+'</p>'+
    (q.core?'<div class="blk core">'+ico("target")+'<div><h4>Yang ditanya</h4><p>'+esc(q.core)+'</p></div></div>':'')+
    '<div class="stack" style="gap:10px">'+rows+'</div>'+
    (q.kon&&q.kon.length?'<div class="blk kon">'+ico("book")+'<div><h4>Konsep di baliknya</h4>'+listHtml(q.kon)+'</div></div>':'')+
    (q.fast&&q.fast.length?'<div class="blk fast">'+ico("zap")+'<div><h4>Cara cepat</h4><ol class="steps">'+q.fast.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ol></div></div>':'')+
    (q.trap?'<div class="blk trap">'+ico("alert")+'<div><h4>Awas jebakan</h4><p>'+esc(q.trap)+'</p></div></div>':'')+
    (q.mn?'<div class="blk mn">'+ico("star")+'<div><h4>Jembatan keledai</h4><p>'+esc(q.mn)+'</p></div></div>':'')+
    statusNote+
   '</div></details>';
}
function renderResult(auto){
  var r=scoreAll(S.ans), sc=r.scaled, app=$("app"), subs=subsIn(), isDiag=(S.mode==="diag");
  var used=Math.min(S.total,Math.round((S.endedAt-S.start)/1000));
  var wrongIdx=Q.map(function(q,i){return i;}).filter(function(i){return !r.per[i].ok;});
  var tkpHit=r.correct.TKP;
  function wrongOf(s){ return wrongIdx.filter(function(i){return Q[i].sub===s;}); }

  var boxes=subs.map(function(s){
    var st=statusOf(sc[s],PG[s]), n=cnt(s);
    var pctv=Math.min(100,sc[s]/MAXFULL[s]*100), pgp=PG[s]/MAXFULL[s]*100;
    var detail=(s==="TKP")?('Tepat sasaran (skor 5): '+tkpHit+' dari '+n+'. Poin mentah '+r.raw[s]+' dari '+(n*5)+'. Target pribadi: '+TKP_TARGET+'+ ('+(sc.TKP>=TKP_TARGET?'tercapai':'belum tercapai')+').'):('Benar '+r.correct[s]+' dari '+n+' soal.');
    return '<div class="scorebox s-'+s+'"><div class="row between"><b>'+s+'</b><span class="pill '+st+'">'+statusLabel(st)+'</span></div>'+
      '<div class="big">'+sc[s]+'<span class="small muted"> / '+MAXFULL[s]+'</span></div>'+
      '<div class="meter" role="img" aria-label="'+s+' '+sc[s]+' dari '+MAXFULL[s]+', passing grade '+PG[s]+'"><i style="width:'+pctv+'%"></i><u style="left:'+pgp+'%"></u></div>'+
      '<div class="small muted">Garis hitam = passing grade '+PG[s]+'. '+detail+'</div></div>';
  }).join("");

  var groups={}, gkeys=[];
  wrongIdx.forEach(function(i){ var q=Q[i], k=q.sub+"|"+mainOf(q); if(!groups[k]){groups[k]={sub:q.sub,main:mainOf(q),nums:[],items:[]}; gkeys.push(k);} groups[k].nums.push(i+1); groups[k].items.push(i); });
  gkeys.sort(function(a,b){ return groups[b].nums.length-groups[a].nums.length; });
  var fam={}, fkeys=[];
  wrongIdx.forEach(function(i){ var f=Q[i].fam; if(!f||!FAMT[f]) return; if(!fam[f]){fam[f]=[];fkeys.push(f);} fam[f].push(i+1); });
  fkeys.sort(function(a,b){ return fam[b].length-fam[a].length; });

  /* A */
  var aHtml=subs.map(function(s){
    var gs=gkeys.filter(function(k){return groups[k].sub===s;});
    var nW=wrongOf(s).length;
    var head='<h3><span class="tag s-'+s+'">'+s+'</span> '+nW+' dari '+cnt(s)+(s==="TKP"?' meleset (skor 4 ke bawah)':' salah atau kosong')+'</h3>';
    if(!gs.length) return '<div class="stack" style="gap:6px">'+head+'<p class="muted">Semua tepat.</p></div>';
    return '<div class="stack" style="gap:6px">'+head+'<ul class="dots s-'+s+'">'+gs.map(function(k){
      var g=groups[k], extra="";
      if(s==="TKP") extra=' (skor kamu: '+g.items.map(function(i){return r.per[i].answered?r.per[i].pts:0;}).join(", ")+')';
      return '<li><b>'+esc(g.main)+'</b>: salah '+g.nums.length+', no. '+g.nums.join(", ")+extra+'</li>';
    }).join("")+'</ul></div>';
  }).join("");
  var rep=fkeys.filter(function(f){return fam[f].length>=2;});
  var patHtml;
  if(!wrongIdx.length) patHtml='<p>Tidak ada kesalahan, jadi tidak ada pola jebakan. Naikkan kesulitan pada sesi berikutnya.</p>';
  else if(rep.length) patHtml='<p><b>Pola jebakan yang berulang:</b></p><ul class="dots" style="margin-top:8px">'+rep.map(function(f){return '<li><b>'+FAMT[f].n+'</b> ('+fam[f].length+' soal, no. '+fam[f].join(", ")+'). '+esc(FAMT[f].d)+'</li>';}).join("")+'</ul>'+
      (fkeys.length>rep.length?'<p class="small muted" style="margin-top:10px">Jebakan yang muncul sekali: '+fkeys.filter(function(f){return fam[f].length<2;}).map(function(f){return FAMT[f].n+' (no. '+fam[f].join(", ")+')';}).join("; ")+'.</p>':'');
  else if(fkeys.length) patHtml='<p>Belum ada pola berulang: tiap jenis jebakan baru muncul sekali ('+fkeys.map(function(f){return FAMT[f].n+' no. '+fam[f].join(", ");}).join("; ")+'). Satu sesi dengan sedikit soal terlalu kecil untuk menyimpulkan kebiasaan. Polanya baru jelas setelah beberapa sesi.</p>';
  else patHtml='<p>Soal yang meleset belum diberi label jenis jebakan, jadi pola belum bisa disimpulkan.</p>';

  /* B */
  var bHtml=!wrongIdx.length?'<p class="muted">Tidak ada nomor yang salah.</p>':wrongIdx.map(function(i){
    var q=Q[i], p=r.per[i], a=S.ans[i], best=(q.sub==="TKP")?q.s.indexOf(5):LETTERS.indexOf(q.k);
    var you=p.answered?('Pilihanmu: <b>'+LETTERS[a]+'</b>'+(q.sub==="TKP"?' (skor '+q.s[a]+')':'')):'Tidak dijawab';
    return '<div class="bedah s-'+q.sub+'"><div class="row between"><span><span class="tag">'+q.sub+'</span> <b>No. '+(i+1)+'</b> <span class="small muted">'+esc(q.topic)+'</span></span><span class="small">'+you+' &rarr; seharusnya <b>'+LETTERS[best]+'</b></span></div>'+
      (q.core?'<p class="small muted">'+esc(q.core)+'</p>':'')+(q.kon&&q.kon.length?listHtml(q.kon):'<p class="small muted">Belum ada bedah konsep untuk soal ini.</p>')+'</div>';
  }).join("");

  /* C */
  var cHtml;
  if(!wrongIdx.length) cHtml='<p class="muted">Tidak ada yang perlu diperbaiki.</p>';
  else {
    cHtml=(fkeys.length?'<div class="stack" style="gap:12px">'+fkeys.map(function(f){return '<div class="blk fast">'+ico("zap")+'<div><h4>'+FAMT[f].n+' (no. '+fam[f].join(", ")+')</h4><p>'+esc(FAMT[f].t)+'</p></div></div>';}).join("")+'</div>':'')+
      '<h3 style="margin-top:6px">Cara cepat per nomor</h3>'+
      '<div class="stack" style="gap:10px">'+wrongIdx.filter(function(i){return Q[i].fast&&Q[i].fast.length;}).map(function(i){return '<div class="blk kon s-'+Q[i].sub+'">'+ico("zap")+'<div><h4>No. '+(i+1)+' &middot; '+esc(Q[i].topic)+'</h4><ol class="steps">'+Q[i].fast.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ol></div></div>';}).join("")+'</div>';
  }

  /* D */
  var redo=subs.filter(function(s){return wrongOf(s).length;});
  var dReq=gkeys.map(function(k){ var g=groups[k];
    return {txt:'Buatkan 5 soal latihan tambahan hanya untuk subtes '+g.sub+', sub-materi '+g.main+' (level HOTS, standar KepmenPANRB 321/2024) dan tambahkan ke bank soal di GitHub. Setelah selesai dikerjakan, beri evaluasi urut A (peta kelemahan), B (bedah konsep), C (tips dan cara cepat).', lab:g.sub+' / '+g.main+' ('+g.nums.length+' salah)'}; });
  var dHtml=!dReq.length?'<p class="muted">Tidak ada sub-materi lemah. Usul: lanjut ke subtes berikutnya atau naikkan tingkat kesulitan.</p>':
    (redo.length?'<div class="stack" style="gap:8px"><b>Ulangi soal yang meleset sekarang</b><div class="row">'+redo.map(function(s){return '<button class="btn primary" data-redo="'+s+'">Ulangi '+wrongOf(s).length+' soal '+s+'</button>';}).join("")+'</div></div>':'')+
    '<p class="small muted" style="margin-top:12px">Untuk menambah soal baru di sub-materi yang lemah, tempel permintaan di bawah ke chat. Pindah topik setelah sub-materi itu dikuasai.</p>'+
    dReq.map(function(x,n){ return '<div class="stack" style="gap:8px;border-top:1px solid var(--line);padding-top:12px"><b>'+esc(x.lab)+'</b><textarea readonly id="dq'+n+'" style="min-height:96px">'+esc(x.txt)+'</textarea><div class="row"><button class="btn" data-dq="'+n+'">Salin permintaan</button><span class="small muted" id="dm'+n+'" role="status"></span></div></div>'; }).join("");

  var spq=S.total/Q.length;
  var pace=subs.map(function(s){
    var idxs=qIdx(s), tot=0; idxs.forEach(function(i){tot+=(S.times[i]||0);});
    var avg=tot/idxs.length, cls=avg>spq*1.3?"low":(avg>spq?"near":"ok");
    return '<tr><td>'+s+'</td><td>'+Math.round(avg)+' dtk</td><td><span class="pill '+cls+'">'+(cls==="ok"?"Sesuai tempo":(cls==="near"?"Agak lambat":"Terlalu lambat"))+'</span></td></tr>';
  }).join("");
  var slow=Q.map(function(q,i){return {i:i,t:S.times[i]||0};}).sort(function(a,b){return b.t-a.t;}).slice(0,3)
    .map(function(x){ return 'No. '+(x.i+1)+' ('+Q[x.i].sub+', '+Math.round(x.t)+' dtk)'; }).join(", ");

  var rv=Q.map(function(q,i){ return reviewCard(i,r); }).join("");
  var summary=buildSummary(r,used,groups,gkeys,fam,fkeys,tkpHit,subs);

  var heroT=isDiag?('Total estimasi '+sc.total+' dari 550'):('Latihan '+S.sub+': benar '+r.correct[S.sub]+' dari '+Q.length);
  var heroP=isDiag?
    ('Waktu terpakai '+fmt(used)+' dari '+fmt(S.total)+(auto?' (waktu habis, jawaban terkunci otomatis)':'')+'. Skor memakai skala 110 soal: poin mentah dibagi poin maksimum paket lalu dikali nilai maksimum SKD. Dengan hanya 8 sampai 9 soal per subtes, margin kesalahan besar. Pakai sebagai arah, bukan vonis.'):
    ('Waktu terpakai '+fmt(used)+' dari '+fmt(S.total)+(auto?' (waktu habis, jawaban terkunci otomatis)':'')+'. Skor di bawah adalah ekstrapolasi kasar ke skala SKD asli dari '+Q.length+' soal saja, jadi lihat polanya, bukan angkanya.');

  app.innerHTML=
  '<div class="wrap stack">'+
   '<div class="row between"><span class="tag">'+(isDiag?'HASIL DIAGNOSTIK':'HASIL LATIHAN '+S.sub)+'</span>'+fsCtl()+'</div>'+
   '<div class="hero stack" style="gap:8px"><h1>'+heroT+'</h1><p>'+heroP+'</p></div>'+
   '<div class="grid3'+(subs.length===1?' one':'')+'">'+boxes+'</div>'+
   '<div class="card stack"><div class="sec-h"><span class="letter">A</span><h2>Peta analisis kelemahan</h2></div>'+aHtml+'<div class="card" style="background:var(--bg)">'+patHtml+'</div></div>'+
   '<div class="card stack"><div class="sec-h"><span class="letter">B</span><h2>Bedah konsep dasar (hanya nomor yang salah)</h2></div>'+bHtml+'</div>'+
   '<div class="card stack"><div class="sec-h"><span class="letter">C</span><h2>Tips dan cara cepat</h2></div>'+cHtml+'</div>'+
   '<div class="card stack"><div class="sec-h"><span class="letter">D</span><h2>Tindak lanjut</h2></div>'+dHtml+'</div>'+
   '<div class="card stack"><h2>Kecepatan</h2><p class="small muted">Tempo target sekitar '+Math.round(spq)+' detik per soal. Soal paling lama: '+slow+'.</p>'+
    '<div class="scroll-x"><table><thead><tr><th>Subtes</th><th>Rata-rata per soal</th><th>Status</th></tr></thead><tbody>'+pace+'</tbody></table></div></div>'+
   '<div class="card stack"><h2>Kirim ringkasan ke Claude</h2><p class="small muted">Salin ringkasan ini lalu tempel ke chat untuk dibuatkan jadwal atau analisis.</p>'+
    '<textarea id="sum" readonly>'+esc(summary)+'</textarea>'+
    '<div class="row"><button class="btn primary" id="bCopy">Salin ringkasan</button><span class="small muted" id="cMsg" role="status"></span></div></div>'+
   '<div id="trk"></div>'+
   '<div class="stack"><div class="row between"><h2>Pembahasan lengkap '+Q.length+' soal</h2><div class="row"><button class="btn" id="fAll">Semua</button><button class="btn" id="fWrong">Yang meleset</button><button class="btn" id="oAll">Buka semua</button><button class="btn" id="cAll">Tutup semua</button></div></div>'+
    '<p class="small muted">Ketuk satu soal untuk membuka pembahasan. Berlaku untuk soal yang benar maupun salah.</p>'+
    '<div class="stack" id="rvList">'+rv+'</div></div>'+
   '<div class="row"><button class="btn primary" id="bAgain">Kembali ke menu</button></div>'+
  '</div>';
  $("bCopy").onclick=function(){ copyText($("sum").value,$("cMsg")); };
  app.onclick=function(e){
    var b=e.target.closest("button[data-dq]");
    if(b){ var n=b.getAttribute("data-dq"); copyText($("dq"+n).value,$("dm"+n)); return; }
    var rd=e.target.closest("button[data-redo]");
    if(rd){ var s=rd.getAttribute("data-redo"); var ids=wrongOf(s).map(function(i){return Q[i].id;}); app.onclick=null; newSession("latihan",s,ids); }
  };
  $("fAll").onclick=function(){ filterRv(false); }; $("fWrong").onclick=function(){ filterRv(true); };
  $("oAll").onclick=function(){ toggleAll(true); }; $("cAll").onclick=function(){ toggleAll(false); };
  $("bAgain").onclick=function(){ lsDel(LS_SESS); S=null; app.onclick=null; renderIntro(); window.scrollTo(0,0); };
  renderTracker("trk"); applyFs();
  window.scrollTo(0,0);
}
function filterRv(onlyWrong){
  Array.prototype.forEach.call(document.querySelectorAll("#rvList details.rv"),function(el){
    el.classList.toggle("hide",onlyWrong&&el.getAttribute("data-ok")==="1");
  });
}
function toggleAll(open){
  Array.prototype.forEach.call(document.querySelectorAll("#rvList details.rv"),function(el){
    if(open&&!el.classList.contains("hide")) el.setAttribute("open",""); else if(!open) el.removeAttribute("open");
  });
}
function buildSummary(r,used,groups,gkeys,fam,fkeys,tkpHit,subs){
  var sc=r.scaled, L=[];
  L.push((S.mode==="diag"?"HASIL DIAGNOSTIK SKD (25 soal campuran, 22 menit)":"HASIL LATIHAN "+S.sub+" ("+Q.length+" soal, "+fmt(S.total)+")"));
  L.push("Waktu terpakai: "+fmt(used)+(S.auto?" (habis)":""));
  L.push("Estimasi skala SKD: "+subs.map(function(s){return s+" "+sc[s]+"/"+MAXFULL[s]+" (PG "+PG[s]+(s==="TKP"?", target pribadi "+TKP_TARGET+"+":"")+")";}).join(", ")+(sc.total!==null?", Total "+sc.total+"/550":""));
  L.push("Mentah: "+subs.map(function(s){return s==="TKP"?("TKP poin "+r.raw.TKP+"/"+(cnt("TKP")*5)+", tepat sasaran (skor 5) "+tkpHit+"/"+cnt("TKP")):(s+" benar "+r.correct[s]+"/"+cnt(s));}).join(", "));
  L.push("Rata-rata detik per soal: "+subs.map(function(s){var t=0;qIdx(s).forEach(function(i){t+=(S.times[i]||0);});return s+" "+Math.round(t/cnt(s));}).join(", ")+" (target ~"+Math.round(S.total/Q.length)+")");
  L.push("Sub-materi meleset: "+(gkeys.length?gkeys.map(function(k){var g=groups[k];return g.sub+" / "+g.main+" (salah "+g.nums.length+": no. "+g.nums.join(",")+")";}).join("; "):"-"));
  L.push("Jenis jebakan: "+(fkeys.length?fkeys.map(function(f){return FAMT[f].n+" (no. "+fam[f].join(",")+")";}).join("; "):"-"));
  L.push("Soal tidak dijawab: "+(Q.length-Object.keys(S.ans).length));
  L.push("ID soal meleset: "+(Q.filter(function(q,i){return !r.per[i].ok;}).map(function(q){return q.id;}).join(", ")||"-"));
  L.push("Aturan: 1 subtes per sesi latihan, TKP tepat sasaran hanya skor 5, evaluasi A-B-C lalu tawaran 5 soal tambahan.");
  L.push("Waktu belajar: 1-1,5 jam malam hari kerja, 2,5-3 jam akhir pekan. Ujian perkiraan Januari 2027.");
  return L.join("\n");
}

/* ===== TRACKER ===== */
function renderTracker(id){
  var el=$(id); if(!el) return;
  var h=lsGet(LS_HIST)||[];
  var rows=h.slice().reverse().map(function(x,ri){
    var idx=h.length-1-ri, full=(x.TWK!=null&&x.TIU!=null&&x.TKP!=null);
    function c(s){ if(x[s]==null) return '<td class="muted">-</td>'; var st=statusOf(x[s],PG[s]); return '<td><span class="pill '+st+'">'+x[s]+'</span></td>'; }
    var d=new Date(x.t), ds=d.toLocaleDateString("id-ID",{day:"2-digit",month:"short"});
    return '<tr><td>'+ds+'</td><td>'+esc(x.label)+(x.est?' <span class="small muted">(skala estimasi)</span>':'')+'</td>'+c("TWK")+c("TIU")+c("TKP")+'<td>'+(full?'<b>'+(x.TWK+x.TIU+x.TKP)+'</b>':'<span class="muted">-</span>')+'</td><td><button class="btn" data-del="'+idx+'" aria-label="Hapus baris">Hapus</button></td></tr>';
  }).join("");
  el.innerHTML='<div class="card stack"><h2>Tracker skor</h2>'+
   '<p class="small muted">Warna mengikuti passing grade 65 / 80 / 166: hijau di atas PG, kuning dalam 10% di bawah PG (batas ini saya tetapkan sendiri), merah lebih rendah. Latihan satu subtes hanya mengisi kolom subtesnya. Riwayat tersimpan di browser ini saja.</p>'+
   (rows?'<div class="scroll-x"><table><thead><tr><th>Tgl</th><th>Tes</th><th>TWK</th><th>TIU</th><th>TKP</th><th>Total</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="muted">Belum ada data. Hasil tes masuk otomatis. Hasil tryout penuh bisa ditambahkan di bawah.</p>')+
   '<form id="addForm" class="stack" style="gap:12px"><h3>Tambah hasil tryout penuh (110 soal)</h3>'+
    '<label for="fl">Nama tryout<input type="text" id="fl" placeholder="mis. TO 1 CPNS" maxlength="40"></label>'+
    '<div class="grid3"><label for="fw">TWK (0-150)<input type="number" id="fw" min="0" max="150" inputmode="numeric"></label>'+
    '<label for="fi">TIU (0-175)<input type="number" id="fi" min="0" max="175" inputmode="numeric"></label>'+
    '<label for="fk">TKP (0-225)<input type="number" id="fk" min="0" max="225" inputmode="numeric"></label></div>'+
    '<div class="row"><button class="btn primary" type="submit">Simpan ke tracker</button><span class="small" id="fErr" role="alert" style="color:var(--bad)"></span></div></form></div>';
  el.onclick=function(e){ var b=e.target.closest("button[data-del]"); if(!b) return; var hh=lsGet(LS_HIST)||[]; hh.splice(parseInt(b.getAttribute("data-del"),10),1); lsSet(LS_HIST,hh); renderTracker(id); };
  $("addForm").onsubmit=function(e){
    e.preventDefault();
    var w=parseInt($("fw").value,10), i=parseInt($("fi").value,10), k=parseInt($("fk").value,10), lb=$("fl").value.trim()||"Tryout penuh";
    var err=$("fErr");
    if(isNaN(w)||isNaN(i)||isNaN(k)){ err.textContent="Isi ketiga skor dengan angka."; return; }
    if(w<0||w>150||i<0||i>175||k<0||k>225){ err.textContent="Skor di luar rentang: TWK 0-150, TIU 0-175, TKP 0-225."; return; }
    var hh=lsGet(LS_HIST)||[]; hh.push({t:Date.now(),label:lb,TWK:w,TIU:i,TKP:k,est:false}); lsSet(LS_HIST,hh); renderTracker(id);
  };
}

/* ===== MULAI ===== */
function showError(msg){
  $("app").innerHTML='<div class="wrap stack"><div class="card stack" style="border-color:var(--bad)"><h2>Soal gagal dimuat</h2><p>'+esc(msg)+'</p>'+
   '<p class="small muted">Halaman ini mengambil soal dari file twk.json, tiu.json, dan tkp.json. Buka lewat alamat web (bukan dengan mengklik dua kali file index.html di komputer), dan pastikan koneksi internet aktif.</p>'+
   '<div class="row"><button class="btn primary" id="bRetry">Coba lagi</button></div></div></div>';
  $("bRetry").onclick=init;
}
function init(){
  applyFs();
  $("app").innerHTML='<div class="wrap"><div class="card"><p>Memuat soal...</p></div></div>';
  loadBank().then(function(){
    if(!BANK.length){ showError("Tidak ada soal yang valid di file JSON."); return; }
    var sess=lsGet(LS_SESS);
    if(sess&&!sess.done&&Array.isArray(sess.ids)&&sess.deadline<=Date.now()&&setQ(sess.ids)){
      S=sess; S.done=true; S.auto=true; S.endedAt=S.deadline; save();
      var r=scoreAll(S.ans), h=lsGet(LS_HIST)||[];
      h.push({t:S.endedAt,label:sessLabel(S)+" (estimasi)",TWK:r.scaled.TWK,TIU:r.scaled.TIU,TKP:r.scaled.TKP,est:true}); lsSet(LS_HIST,h);
      var st=getStats(); Q.forEach(function(q,i){ var s=st[q.id]||{n:0,c:0}; s.n++; if(r.per[i].ok) s.c++; st[q.id]=s; }); lsSet(LS_STATS,st);
      renderResult(true);
    } else { renderIntro(); }
  }).catch(function(e){ showError(String(e&&e.message?e.message:e)); });
}
init();
</script>
</body>
</html>
